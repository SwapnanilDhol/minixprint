[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minixprint"
version = "0.1.0"
description = "Print server and rendering toolkit for the Seznik MiniX (LuckJingle S1) thermal printer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["thermal-printer", "seznik", "minix", "luckjingle", "bluetooth-le", "escpos", "raspberry-pi", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
]
dependencies = [
    "Pillow>=10.1",
    "qrcode>=7.4",
    "python-barcode>=0.15",
    # markdown-it-py over mistune: strict CommonMark, a stable token/tree API
    # (SyntaxTreeNode) that makes block-level layout easy, and pure Python, so
    # it installs cleanly on a Raspberry Pi. Older releases keep Python 3.9 support.
    "markdown-it-py>=2.2",
    "requests>=2.28",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
ble = ["bleak>=0.21"]
dev = ["pytest>=7", "httpx>=0.24", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/SwapnanilDhol/minixprint"
Documentation = "https://github.com/SwapnanilDhol/minixprint/tree/main/docs"
Issues = "https://github.com/SwapnanilDhol/minixprint/issues"
Changelog = "https://github.com/SwapnanilDhol/minixprint/blob/main/CHANGELOG.md"

[project.scripts]
minixprint = "minixprint.cli:main"

[tool.setuptools.packages.find]
include = ["minixprint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"minixprint.jobs" = ["data/*.txt"]
"minixprint.server" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["receipt.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Existing code was written to ~120 columns; don't churn it for E501.
ignore = ["E501"]
