<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* tailscale serve strips the prefix and may serve /print without the slash; relative assets need it */
if(!location.pathname.endsWith("/"))location.replace(location.pathname+"/"+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MiniX Print</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <div class="brand">MiniX<span>print</span></div>
  <div class="chips">
    <span class="chip" id="c-batt">🔋 —</span>
    <span class="chip" id="c-paper">paper —</span>
    <span class="chip" id="c-busy">idle</span>
    <span class="chip" id="c-transport">—</span>
    <span class="chip" id="c-queue">queue 0</span>
    <span class="chip user" id="c-user"></span>
  </div>
</header>
<div id="fake" class="banner" hidden>Fake mode — no printer connected. Jobs are archived but nothing is printed.</div>
<div id="toast" role="status"></div>

<main>
<section class="card">
  <h2>Compose</h2>
  <nav class="tabs" id="tabs">
    <button data-tab="text" class="on">Text</button>
    <button data-tab="markdown">Markdown</button>
    <button data-tab="receipt">Receipt</button>
    <button data-tab="image">Image</button>
    <button data-tab="qr">QR</button>
  </nav>

  <div class="pane" data-pane="text">
    <textarea id="t-text" rows="5" placeholder="Hello from the MiniX!"></textarea>
    <div class="row">
      <label>Size <input id="t-size" type="number" value="28" min="8" max="120"></label>
      <label>Align <select id="t-align"><option>left</option><option>center</option><option>right</option></select></label>
      <label class="chk"><input id="t-bold" type="checkbox"> Bold</label>
      <label class="chk"><input id="t-mono" type="checkbox"> Mono</label>
    </div>
  </div>

  <div class="pane" data-pane="markdown" hidden>
    <textarea id="m-text" rows="7" placeholder="# Title&#10;- item one&#10;- item two"></textarea>
  </div>

  <div class="pane" data-pane="receipt" hidden>
    <label class="chk"><input id="r-json" type="checkbox"> Edit as JSON</label>
    <div id="r-form">
      <label>Title <input id="r-title" value="DOSA &amp; CO."></label>
      <label>Subtitle <input id="r-sub" placeholder="12 Main St"></label>
      <div id="r-items"></div>
      <button class="ghost" id="r-add" type="button">+ item</button>
      <div class="row">
        <label>Tax label <input id="r-taxl" value="GST"></label>
        <label>Rate % <input id="r-taxr" type="number" step="0.1" value="5"></label>
        <label>Currency <input id="r-cur" value="INR"></label>
      </div>
      <label>Footer <input id="r-foot" value="Thank you!"></label>
    </div>
    <textarea id="r-raw" rows="12" hidden spellcheck="false"></textarea>
  </div>

  <div class="pane" data-pane="image" hidden>
    <input id="i-file" type="file" accept="image/*">
    <div class="row">
      <label>Dither <select id="i-dither"><option value="atkinson">Atkinson</option><option value="fs">Floyd–Steinberg</option><option value="none">None</option></select></label>
      <label class="chk"><input id="i-invert" type="checkbox"> Invert</label>
    </div>
    <label>Gamma <output id="i-gout">1.0</output> <input id="i-gamma" type="range" min="0.4" max="2.4" step="0.1" value="1"></label>
  </div>

  <div class="pane" data-pane="qr" hidden>
    <input id="q-data" placeholder="https://example.com">
    <input id="q-cap" placeholder="Caption (optional)">
  </div>

  <div class="actions">
    <button id="btn-preview" class="ghost">Preview</button>
    <button id="btn-print" class="primary">Print</button>
  </div>
  <div id="preview" class="paper" hidden><img alt="preview"></div>
</section>

<section class="card">
  <h2>Fun</h2>
  <div id="jobs" class="jobgrid"></div>
  <div id="jobpanel" hidden>
    <div class="jobname" id="jobname"></div>
    <textarea id="jobparams" rows="2" spellcheck="false" placeholder='{}'></textarea>
    <div class="actions">
      <button id="job-preview" class="ghost">Preview</button>
      <button id="job-print" class="primary">Print</button>
    </div>
    <div id="jobprev" class="paper" hidden><img alt="job preview"></div>
  </div>
</section>

<section class="card">
  <h2>Schedules</h2>
  <ul id="sched" class="list"></ul>
  <form id="sched-form" class="stack">
    <input id="s-spec" placeholder="daily 07:30 · weekly MON,FRI 18:00 · every 30m" required>
    <div class="row">
      <select id="s-job"></select>
      <input id="s-params" placeholder='params JSON (optional)'>
    </div>
    <button class="primary" type="submit">Add schedule</button>
  </form>
</section>

<section class="card" id="live">
  <h2>Live</h2>
  <ul id="feeds" class="list"></ul>
  <form id="feed-form" class="stack">
    <div class="row">
      <select id="f-kind"></select>
      <label>Every <input id="f-int" type="number" min="5" style="width:5em"> s</label>
    </div>
    <div id="f-params" class="stack"></div>
    <button class="primary" type="submit">Add &amp; start</button>
  </form>
</section>

<section class="card">
  <h2>History</h2>
  <div id="hist" class="strip"></div>
  <div class="row spaced">
    <button class="ghost" id="feed">Feed paper</button>
    <details id="settings"><summary>Settings</summary>
      <div class="stack">
        <label>Home airport <input id="st-home"></label>
        <label>Airports <input id="st-air" placeholder="VOMM, VOBL"></label>
        <label>Timezone <input id="st-tz"></label>
        <label>Density (0–2) <input id="st-den" type="number" min="0" max="2"></label>
        <label>Max height px <input id="st-max" type="number" min="100"></label>
        <button class="ghost" id="st-save">Save settings</button>
      </div>
    </details>
  </div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
