<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>minixprint</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V4h10v4M7 17H5a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M7 14h10v6H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-fun" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-live" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6H21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8L4 8.5M4 4v4.5h4.5M12 8v4.2l2.8 1.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10.5" r="1.7" fill="currentColor"/><path d="M4 17l5-4.5 3.5 3 3-2.5L20 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-md" viewBox="0 0 24 24"><path d="M5 17V7l3.5 4.5L12 7v10M16 7v8m0 0l-2.2-2.4M16 15l2.2-2.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2.5v2.5H14zM18 14h2v2h-2zM14 18.5h2v1.5h-2zM18 18h2v2h-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9M13 4.5v5m-6 5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

<header id="top">
  <div id="bar">
    <div class="brand" id="brand">
      <svg class="ico"><use href="#i-print"/></svg>
      <span id="h-name" class="name skel">&nbsp;</span>
    </div>
    <div class="chips" id="chips" aria-live="polite">
      <span class="chip skel" id="h-conn">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
      <span class="chip" id="h-batt" hidden></span>
      <span class="chip" id="h-queue" title="Jobs waiting to print">Queue 0</span>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="Settings"><svg class="ico"><use href="#i-gear"/></svg></button>
  </div>
  <nav id="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="print" aria-selected="true"><svg class="ico"><use href="#i-print"/></svg><span>Print</span></button>
    <button role="tab" data-tab="fun" aria-selected="false"><svg class="ico"><use href="#i-fun"/></svg><span>Fun</span></button>
    <button role="tab" data-tab="live" aria-selected="false"><svg class="ico"><use href="#i-live"/></svg><span>Live</span></button>
    <button role="tab" data-tab="history" aria-selected="false"><svg class="ico"><use href="#i-history"/></svg><span>History</span></button>
  </nav>
</header>

<main id="main">
  <!-- PRINT -->
  <section class="panel" id="p-print" role="tabpanel" data-panel="print">
    <div class="card compose">
      <label class="sr" for="t-text">Text to print</label>
      <textarea id="t-text" rows="4" placeholder="Print something…" enterkeyhint="enter"></textarea>
      <div class="pills" role="group" aria-label="Text options">
        <div class="seg" id="t-size" role="radiogroup" aria-label="Size">
          <button role="radio" data-v="22">S</button><button role="radio" data-v="28" aria-checked="true">M</button><button role="radio" data-v="40">L</button>
        </div>
        <div class="seg" id="t-align" role="radiogroup" aria-label="Alignment">
          <button role="radio" data-v="left" aria-checked="true">Left</button><button role="radio" data-v="center">Centre</button><button role="radio" data-v="right">Right</button>
        </div>
        <button class="pill" id="t-bold" aria-pressed="false"><b>Bold</b></button>
      </div>
      <div class="row-actions">
        <button class="btn ghost" id="t-preview">Preview</button>
        <button class="btn primary grow" id="t-print"><svg class="ico"><use href="#i-print"/></svg>Print</button>
      </div>
    </div>

    <div class="tiles3">
      <button class="tile-btn" id="go-photo"><svg class="ico"><use href="#i-photo"/></svg><span>Photo</span></button>
      <button class="tile-btn" id="go-md"><svg class="ico"><use href="#i-md"/></svg><span>Markdown</span></button>
      <button class="tile-btn" id="go-qr"><svg class="ico"><use href="#i-qr"/></svg><span>QR code</span></button>
    </div>

    <details class="adv" id="adv">
      <summary><svg class="ico"><use href="#i-sliders"/></svg>Advanced<svg class="ico chev"><use href="#i-chev"/></svg></summary>
      <div class="adv-body">
        <div class="field">
          <span class="lbl">Print darkness</span>
          <div class="seg" id="a-density" role="radiogroup" aria-label="Density">
            <button role="radio" data-v="0">Light</button><button role="radio" data-v="1">Medium</button><button role="radio" data-v="2">Dark</button>
          </div>
        </div>
        <div class="field">
          <span class="lbl">Feed paper</span>
          <div class="seg plain" id="a-feed">
            <button data-v="80">A little</button><button data-v="200">Some</button><button data-v="400">A lot</button>
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="a-receipt">Receipt (JSON)</label>
          <textarea id="a-receipt" class="mono" rows="9" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
          <div class="row-actions">
            <button class="btn ghost" id="a-rpreview">Preview</button>
            <button class="btn grow" id="a-rprint">Print receipt</button>
          </div>
        </div>
      </div>
    </details>
  </section>

  <!-- FUN -->
  <section class="panel" id="p-fun" role="tabpanel" data-panel="fun" hidden></section>

  <!-- LIVE -->
  <section class="panel" id="p-live" role="tabpanel" data-panel="live" hidden></section>

  <!-- HISTORY -->
  <section class="panel" id="p-history" role="tabpanel" data-panel="history" hidden></section>
</main>

<div id="toasts" aria-live="polite" aria-atomic="true"></div>
<dialog id="sheet" aria-labelledby="sheet-title"></dialog>

<script src="app.js?v=5"></script>
</body>
</html>
